<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Pro - Dracula Edition</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

    <!-- TELA DE BOAS-VINDAS -->
    <div id="login-screen" class="container">
        <div class="card">
            <h1 style="color: var(--purple)">Bem-vindo</h1>
            <p>Recepção do casamento</p>
            <button onclick="checkAuth()">INICIAR</button>
            <p id="login-error" class="error-text"></p>
        </div>
    </div>

    <!-- APP PRINCIPAL -->
    <div id="app-screen" class="container" style="display: none;">
        <div class="nav">
            <button onclick="showSection('scan')">SCANNER</button>
            <button onclick="showSection('list')">LISTA</button>
        </div>

        <button id="reset-list-button" class="reset-list-button" onclick="resetSystem()" title="Recarregar lista">↺ RECARREGAR</button>

        <!-- SEÇÃO SCANNER -->
        <div id="sec-scan" class="section">
            <div class="mode-switch">
                <button id="mode-in" class="active" onclick="setMode('entrada')">ENTRADA</button>
                <button id="mode-out" onclick="setMode('saida')">SAÍDA</button>
            </div>

            <div class="scan-control">
                <button id="btn-trigger" onclick="triggerScan()">ABRIR CÂMERA E SCANNEAR</button>
            </div>

            <div id="feedback" class="status-box">
                <h2 id="fb-title">PRONTO</h2>
                <p id="fb-desc">Toque em “Abrir câmera” para iniciar a leitura.</p>
            </div>
        </div>

        <!-- SEÇÃO LISTA -->
        <div id="sec-list" class="section" style="display: none;">
            <div class="stats">
                <div class="stat">DENTRO: <b id="count-in">0</b></div>
                <div class="stat">GRUPOS: <b id="count-total">0</b></div>
            </div>
            <div id="list-table"></div>
        </div>

    </div>

    <div id="camera-modal" role="dialog" aria-modal="true" aria-label="Leitura de convite">
        <div id="camera-stage">
            <div id="reader"></div>
        </div>
        <button id="camera-close" type="button" onclick="closeCameraModal()" aria-label="Sair da câmera">×</button>
        <div id="camera-controls-panel">
            <div id="camera-toast" role="status" aria-live="polite">
                <h2 id="camera-toast-title"></h2>
                <p id="camera-toast-desc"></p>
            </div>
            <div class="camera-controls" aria-label="Controles da câmera">
                <button id="btn-focus" type="button" onclick="improveCameraFocus()" disabled>FOCO AUTOMÁTICO</button>
                <label for="camera-zoom">Zoom: <output id="zoom-value">1×</output></label>
                <input id="camera-zoom" type="range" min="1" max="1" step="0.1" value="1" disabled oninput="setCameraZoom(this.value)">
                <p id="camera-status" role="status">Aguardando a câmera...</p>
            </div>
            <div class="camera-action-row">
                <button id="btn-modal-scan" type="button" onclick="startReading()">SCANEAR</button>
                <button id="btn-toggle-reading" type="button" onclick="toggleReading()">PARAR LEITURA</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
